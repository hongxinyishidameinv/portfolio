<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>洪欣怡的个人网站</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶部个人名片 -->
  <header class="card profile-card" id="profileCard" role="banner">
    <div class="profile-left">
      <div class="avatar" id="avatar"></div>
    </div>
    <div class="profile-info">
      <h1 class="profile-name" id="profileName">姓名</h1>
      <div class="profile-rows">
        <p class="profile-row" id="profileRow1">学校 · 专业 · 届别</p>
        <p class="profile-row" id="profileRow2">学业表现 · 政治面貌</p>
        <div class="profile-contacts">
        <p class="profile-row" id="profileRow3">
          <span id="profilePhone">电话</span>
        </p>
        <p class="profile-row" id="profileRow4">
          <span id="profileEmail">邮箱</span>
        </p>
        </div>
      </div>
    </div>
    <div class="profile-actions">
      <a class="btn btn-primary" id="resumeBtn" href="#" disabled aria-disabled="true">简历待上传</a>
    </div>
  </header>

  <!-- 下方：左导航 + 右内容 -->
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="栏目导航">
      <ul class="nav-list" id="navList"></ul>
    </nav>

    <main class="content" id="content" tabindex="-1">
      <!-- 内容由 app.js 动态渲染 -->
    </main>
  </div>

  <script src="js/data.js?v=20261011-media2"></script>
  <script src="js/app.js?v=20261011-video-diagnostics"></script>
  <script src="js/cursor-trail.js"></script>
</body>
</html>
